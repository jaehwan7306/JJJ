# Windows + PyCharm Jupyter + Python 3.11.9 + one RTX 3070.
# Run from the repository root. Paths are relative to the working directory.
# One model at a time on cuda:0, NF4 4bit, float16, SDPA, batch size 1.
dataset = "data/contract-nli/test.json"
output_dir = "outputs/rtx3070_base"
conditions = ["original", "naive", "contextualized", "longllmlingua"]
# Keep approximately 30% of original context tokens (remove approximately 70%).
# Common counting tokenizer: judge model. Actual retention is recorded separately.
retention_ratio = 0.30
judge_max_new_tokens = 16
seed = 42
# For a smoke run, uncomment this and use a distinct output directory.
# max_documents = 2

[summarizer]
name = "Qwen/Qwen2.5-7B-Instruct"
revision = "main"
device = "cuda"
dtype = "float16"
quantization = "4bit"
max_input_tokens = 32768

[judge]
name = "Qwen/Qwen3-8B"
revision = "main"
device = "cuda"
dtype = "float16"
quantization = "4bit"
max_input_tokens = 32768

[compressor]
# LongLLMLingua scoring model (not the judge or summarization model).
name = "NousResearch/Llama-2-7b-hf"
revision = "main"
device = "cuda"
dtype = "float16"
quantization = "4bit"
max_input_tokens = 4096
