# Windows + PyCharm Jupyter + Python 3.11.9 + RTX 5070 (Blackwell).
# Install torch 2.8.0 from the official CUDA 12.8 wheel index first.
# One model at a time on cuda:0, NF4 4bit, float16, SDPA, batch size 1.
dataset = "data/contract-nli/test.json"
output_dir = "outputs/rtx5070_base"
conditions = ["original", "naive", "contextualized", "longllmlingua"]
retention_ratio = 0.30
judge_max_new_tokens = 16
seed = 42

[summarizer]
name = "Qwen/Qwen2.5-7B-Instruct"
revision = "main"
device = "cuda"
dtype = "float16"
quantization = "4bit"
max_input_tokens = 32768

[judge]
name = "Qwen/Qwen3-8B"
revision = "main"
device = "cuda"
dtype = "float16"
quantization = "4bit"
max_input_tokens = 32768

[compressor]
# Official LongLLMLingua default scorer, unchanged from the base experiment.
name = "NousResearch/Llama-2-7b-hf"
revision = "main"
device = "cuda"
dtype = "float16"
quantization = "4bit"
max_input_tokens = 4096
